<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="overlay"></div>


  
  <div class="container">

    <header>
      <h1 id="app-title">To-Do Workspace</h1>

      <select id="language-select">
        <option value="en">English</option>
        <option value="zu">Zulu</option>
        <option value="af">Afrikaans</option>
        <option value="xh">Xhosa</option>
        <option value="nr">Ndebele</option>
        <option value="fr">French</option>
        <option value="zh">Chinese</option>
        <option value="es">Spanish</option>
        <option value="pt">Portuguese</option>
      </select>
    </header>

    <!-- SEARCH -->
    <section class="search-section">
      <input type="text" id="searchInput" placeholder="Search tasks and notes...">
    </section>

    <!-- TASK INPUT -->
    <section class="task-input-section">
      <input type="text" id="taskInput" placeholder="Add new task...">
    </section>
    <section class="task-input-section">
      <div class="task-input-row">
        <input type="text" id="taskInput" placeholder="Add new task...">
         <input type="date" id="dueDateInput">
          </div>
          </section>

    <!-- FILTERS -->
    <section class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </section>

    <!-- RECENT TASKS -->
    <section class="board">
      <div class="column">
        <h2>Recently Added</h2>
        <div id="recentTasks"></div>
      </div>

      <div class="column">
        <h2>To Do</h2>
        <div id="todoList"></div>
      </div>

      <div class="column">
        <h2>In Progress</h2>
        <div id="progressList"></div>
      </div>

      <div class="column">
        <h2>Completed</h2>
        <div id="completedList"></div>
      </div>
    </section>

    <!-- NOTES -->
    <section class="notes-section">
      <h2>Notes</h2>

      <input type="text" id="noteInput" placeholder="Add a note...">

      <div id="notesList"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
